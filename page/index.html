<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T3 Code Quotas</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    font: 13px/1.5 var(--magpie-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    background: var(--magpie-bg, Canvas);
    color: var(--magpie-fg, CanvasText);
  }
  .box { text-align: center; color: var(--magpie-muted, GrayText); max-width: 520px; padding: 0 16px; }
  .box b { display: block; color: var(--magpie-fg, CanvasText); font-size: 14px; margin-bottom: 6px; }
  .box p { margin: 6px 0; }
  .box button { margin-top: 8px; font: inherit; padding: 4px 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <b id="bootTitle">T3 Code Quotas</b>
    <div id="said">…</div>
  </div>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
